[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "cli-ai-management-suite"
version = "0.1.0"
description = "om: a terminal UI and CLI for local Ollama models, Claude Code on Ollama, and Claude and Ollama backups"
readme = "README.md"
requires-python = ">=3.9"

[project.scripts]
om = "om:cli"

[tool.setuptools]
py-modules = ["om", "om_chat", "om_screensavers", "om_backups"]
